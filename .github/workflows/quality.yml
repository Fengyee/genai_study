name: Quality checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # GitHub cron uses UTC. Avoid minute zero's busiest queue.
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install pinned CPU dependencies
        run: |
          python -m pip install --require-hashes -r requirements-lock.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Run checks and record each outcome
        run: bash scripts/quality.sh
      - name: Retain checks and failure records
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/quality/
          if-no-files-found: warn
          retention-days: 14
