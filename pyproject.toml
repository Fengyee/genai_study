[build-system]
requires = ["setuptools==75.6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genai-study"
version = "0.1.0"
description = "Reproducible generative AI learning experiments for PyTorch researchers"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "Apache-2.0"}
dependencies = ["torch==2.6.0", "numpy==2.1.3", "matplotlib==3.9.3"]

[project.optional-dependencies]
dev = ["pytest==8.3.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
